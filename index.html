<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Candle Predictor PRO</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#0b1020;
  color:#fff;
  font-family:Arial,sans-serif
}

header{text-align:center;margin:10px 0 20px}

h1{font-size:24px;color:#55e6a5}
p{color:#aab5cc;font-size:14px;line-height:1.5}

.card{
  background:#151d30;
  border:1px solid #293650;
  border-radius:14px;
  padding:16px;
  margin:14px 0
}

label{
  display:block;
  color:#aab5cc;
  margin:10px 0 7px
}

select,button{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #35415c;
  background:#202b42;
  color:white;
  font-size:16px;
  margin-bottom:10px
}

button{
  background:#16a875;
  border:0;
  font-weight:bold
}

.signal{text-align:center;padding:22px}

#signal{font-size:35px;margin:12px 0}

.badge{
  display:inline-block;
  background:#493a19;
  color:#ffd66b;
  padding:7px 12px;
  border-radius:20px;
  font-size:12px
}

.stat{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin:15px 0;
  font-size:14px
}

.stat span:last-child{
  text-align:right;
  overflow-wrap:anywhere
}

.small{font-size:12px;line-height:1.7}

.good{color:#55e6a5}
.bad{color:#ff6878}
.wait{color:#ffd66b}

footer{
  text-align:center;
  color:#8390a8;
  font-size:12px;
  line-height:1.7;
  padding:15px
}
</style>
</head>
